<!DOCTYPE html>
<html>
<head>
<title>Embedded Content</title>
<link rel="icon" href="https://commons.wikimedia.org/wiki/File:ICON_SIMORPEN.png#/media/File:ICON_SIMORPEN.png" />
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzVCNyZl9UFF3nv_t1nZZq-bYvnBaFTtKXeTni2DqWf3fKunA0mOlJqxOc3gprbR6X1Xg/exec"
width="100%"
height="100%"
allowfullscreen="true"
style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>
<script>
window.onload = function() {
document.querySelector('iframe').requestFullscreen().catch((err) => {
console.error(`Error attempting to enable full-screen mode: ${err.message}`);
});
};
</script>
</body>
</html>
